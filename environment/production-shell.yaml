security:
  dataClassification: "Internal"
  dataDesignation: ["MI"]

ownership:
  driEmail: benjamin.lorenz@mongodb.com

env:
  NODE_ENV: prod
  AWS_REGION: us-east-1
  OPENAI_MODEL: gpt-4o
  OPENAI_BASE_URL: "https://ai-gateway.corp.mongodb.com/openai/v1"   # Grove AI Gateway; OPENAI_API_KEY holds a Grove gateway key
  AGENT_MODE: all
  DEMO_DISABLE_FILE_WATCH: "1"   # immutable image — no mcp_servers/ hot-reload needed
  IBN_DASHBOARD_URL: "https://agentic-mcp-demo-ibn.industrysolutions.prod.corp.mongodb.com"
  DTW_DASHBOARD_URL: "https://agentic-mcp-demo-dtw.industrysolutions.prod.corp.mongodb.com"
  # Production runs the shell on Atlas Agent Engine (web/twin_shell.py), as
  # staging does: the same noc-coordinator in the IST Telco project, data on
  # oss-demos, the kanopy-shell-staging service account (shared with staging).
  # Unset SHELL_APP and point MONGODB_URI back at agentic-mcp-demo-secrets for
  # the legacy shell (or revert the release merge on main).
  SHELL_APP: "web.twin_shell:app"
  TZ: UTC   # like the agents' tool sandboxes (writers store naive datetime.now())
  TWIN_IBN_DASHBOARD_URL: "https://agentic-mcp-demo-ibn.industrysolutions.prod.corp.mongodb.com"
  TWIN_DTW_DASHBOARD_URL: "https://agentic-mcp-demo-dtw.industrysolutions.prod.corp.mongodb.com"
  # The shell holds 6 visitors at once; a session whose tabs are all closed
  # frees its slot after this many idle seconds. An open tab keeps its session.
  DEMO_SESSION_TTL_SEC: "600"
  # Every new or reset lane starts at autonomy L4 (the agent fixes a morning
  # rush on its own); the IBN dashboard's L3/L4 switch sets L3 for one demo.
  TWIN_AUTONOMY_DEFAULT: L4

envSecrets:
  OPENAI_API_KEY: agentic-mcp-demo-secrets
  MONGODB_URI: agentic-mcp-demo-ae-secrets
  VOYAGE_API_KEY: agentic-mcp-demo-secrets
  AE_CLIENT_ID: agentic-mcp-demo-ae-secrets
  AE_CLIENT_SECRET: agentic-mcp-demo-ae-secrets

serviceAccount:
  enabled: true
  irsa:
    accountId: "275662791714"
    roleName: "kanopy-prod-cicd-irsa"
