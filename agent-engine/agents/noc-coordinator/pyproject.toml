[project]
name = "noc-coordinator"
version = "0.1.0"
description = "NOC coordinator agent for Atlas Agent Engine."
requires-python = ">=3.11"
dependencies = [
    "telco-runtime",
    "oss-tools",
    "telco-catalog",
    "grpcio>=1.76.0",
    "grpcio-health-checking>=1.76.0",
]

[project.scripts]
noc-coordinator = "noc_coordinator.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/noc_coordinator"]

# Repo-local packages. Paths are relative to this directory; the monorepo
# agent.yaml at the repo root makes the repo root the build archive root,
# so they resolve in cloud builds too.
[tool.uv.sources]
telco-runtime = { path = "../../telco-runtime" }
oss-tools = { path = "../../../oss_tools" }
telco-catalog = { path = "../../../agents/catalog" }

[dependency-groups]
dev = ["pyright>=1.1.390", "ruff>=0.1.0"]

[tool.ruff]
line-length = 100
target-version = "py311"
