# $Id: nginx.conf,v 1.23 2026/03/19 15:11:29 bjjl Exp $

user   nginx  nginx;
worker_processes  4;

events {

    # After increasing this value You probably should increase limit
    # of file descriptors (for example in start_precmd in startup script)
    worker_connections  1024;

}

http {

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    include       /usr/pkg/etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    #tcp_nopush     on;

    keepalive_timeout  65;

    # Compression — ~75-80% wire-size cut on text assets (the qwabbl asset
    # bundle drops from ~1.8MB to roughly 400KB).  text/html is always
    # compressed once gzip is on; the list below adds CSS/JS/JSON/SVG (both
    # .js MIME spellings — nginx's mime.types mapping changed between
    # releases).  Fonts/images are already-compressed formats, so not listed.
    gzip              on;
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_types        text/css text/plain text/xml application/javascript
                      text/javascript application/json application/xml
                      image/svg+xml;

    # TLS session resumption — repeat visitors skip the full handshake.
    # (OCSP stapling deliberately not configured: Let's Encrypt retired OCSP
    # in Aug 2025 and our certs carry no OCSP responder URL, so browsers
    # don't query OCSP and there is nothing for nginx to staple.)
    ssl_session_cache    shared:SSL:10m;
    ssl_session_timeout  1d;

    # qwabbl media edge cache: GridFS-served images/attachments are
    # content-addressed and immutable, so first views need not transit
    # uvicorn/Atlas more than once per file.  The app marks ONLY
    # world-readable (public-channel) media `Cache-Control: public`;
    # gated media is `private` and nginx will not store it, so the
    # access gate cannot be bypassed via the cache.
    proxy_cache_path /var/cache/nginx/qwabbl_media levels=1:2
                     keys_zone=qwabbl_media:10m max_size=2g inactive=30d
                     use_temp_path=off;

    server {
        listen 80;

        server_name wichtel.land www.wichtel.land;
        return 301 https://wichtel.land$request_uri;
    }

    server {
        listen 443 ssl;
        http2 on;

        server_name wichtel.land www.wichtel.land;
        access_log /var/log/nginx/wichtel.land/access.log;

        ssl_certificate      /usr/local/etc/letsencrypt/certs/wichtel.land/fullchain.pem;
        ssl_certificate_key  /usr/local/etc/letsencrypt/certs/wichtel.land/privkey.pem;

        root /var/www/wichtel.land;

        location /.well-known/acme-challenge {
            alias /var/www/dehydrated;
        }
    }

    server {
        listen 80;
        server_name ypsilon.news www.ypsilon.news;

        location /robots.txt {
            access_log off;
            alias /usr/local/share/ist.media/app/templates/robots.txt;
        }

        location / {
            return 301 https://ypsilon.news$request_uri;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name ypsilon.news www.ypsilon.news;
        access_log /var/log/nginx/ist.media/access.log;

        error_page 401 /401.html;

        ssl_certificate      /usr/local/etc/letsencrypt/certs/ypsilon.news/fullchain.pem;
        ssl_certificate_key  /usr/local/etc/letsencrypt/certs/ypsilon.news/privkey.pem;

        location /.well-known/acme-challenge {
            alias /var/www/dehydrated;
        }

        location /robots.txt {
            access_log off;
            alias /usr/local/share/ist.media/app/templates/robots.txt;
        }

        location = /401.html {
            root /usr/local/share/content;
            internal;
        }

        location /css/ {
            alias /usr/local/share/ist.media/app/templates/css/;
        }

        location /fontawesome/ {
            alias /usr/local/share/ist.media/app/templates/fontawesome/;
        }

        location /js/ {
            alias /usr/local/share/ist.media/app/templates/js/;
        }

        location /img/ {
            alias /usr/local/share/ist.media/app/templates/img/;
        }

        location /video/ {
            alias /usr/local/share/ist.media/app/templates/video/;
        }

        location /content/ {
            alias /usr/local/share/content/;
        }

        location ^~ /post {
            try_files $uri @uwsgi;
        }

        location ^~ /daily {
            try_files $uri @uwsgi;
        }

        location ^~ /feed {
            try_files $uri @uwsgi;
        }

        location / {
            satisfy any;
            allow 3.77.23.0/24;
            allow 4.35.206.216/29;
            allow 217.111.62.0/24;
            deny all;
            auth_basic "Restricted Content";
            auth_basic_user_file /usr/pkg/etc/nginx/htpasswd;
            try_files $uri @uwsgi; 
        }

        location @uwsgi {
            include uwsgi_params;
            uwsgi_pass unix:/tmp/uwsgi_media.sock;

            # when a client closes the connection then keep the channel
            # to uwsgi open. Otherwise uwsgi throws an IOError
            uwsgi_ignore_client_abort on;

            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }

    server {
        listen 80;
        server_name files.mx.plus;

        location ^~ /.well-known/acme-challenge {
            alias /var/www/dehydrated;
        }
        location / {
            return 301 https://files.mx.plus$request_uri;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name files.mx.plus;

        client_max_body_size 1024M; 

        auth_basic "File Server";
        auth_basic_user_file /usr/local/etc/dufs/users;

        access_log /var/log/nginx/files.mx.plus.access.log;
        error_log /var/log/nginx/files.mx.plus.error.log;

        ssl_certificate /usr/local/etc/letsencrypt/certs/files.mx.plus/fullchain.pem;
        ssl_certificate_key /usr/local/etc/letsencrypt/certs/files.mx.plus/privkey.pem;

        location ^~ /.well-known/acme-challenge {
            auth_basic off;
            alias /var/www/dehydrated;
        }

        location ~ ^/(__dufs_v|favicon\.ico|robots\.txt) {
            auth_basic off;
            proxy_pass http://127.0.0.1:5000;
            proxy_set_header Host $host;
        }

        location = / {
            set $browser_redir "";
            if ($request_method ~* "^(GET|HEAD)$") {
                set $browser_redir "method";
            }
            if ($remote_user != "") {
                set $browser_redir "${browser_redir}_authed";
            }
            if ($browser_redir = "method_authed") {
                return 302 https://files.mx.plus/$remote_user/;
            }
            if ($browser_redir = "_authed") {
                return 405;
            }
        }

        location ~ ^/(?<username>[^/]+)(/.*)?$ {
            set $deny "";
            if ($remote_user != "") {
                set $deny "auth";
            }
            if ($username != $remote_user) {
                set $deny "${deny}_mismatch";
            }
            if ($deny = "auth_mismatch") {
                return 403;
            }

            proxy_pass http://127.0.0.1:5000;
            proxy_set_header Host               $host;
            proxy_set_header X-Real-IP          $remote_addr;
            proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto  $scheme;
            proxy_set_header Destination        $http_destination;

            proxy_http_version      1.1;
            proxy_set_header        Connection "";
            proxy_buffering         off;
            proxy_request_buffering off;
            proxy_read_timeout      600s;
            proxy_send_timeout      600s;
        }
    }

    server {
        listen 80;
        server_name dav.mx.plus;
    
        location /.well-known/acme-challenge {
            alias /var/www/dehydrated;
        }
    
        location / {
            return 301 https://dav.mx.plus$request_uri;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name dav.mx.plus;

        access_log /var/log/nginx/dav.mx.plus.access.log;
        error_log /var/log/nginx/dav.mx.plus.error.log;

        ssl_certificate /usr/local/etc/letsencrypt/certs/dav.mx.plus/fullchain.pem;
        ssl_certificate_key /usr/local/etc/letsencrypt/certs/dav.mx.plus/privkey.pem;

        location /.well-known/acme-challenge {
            alias /var/www/dehydrated;
        }

        location / {
            proxy_pass http://127.0.0.1:5232/;
            proxy_set_header X-Script-Name /;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Host $http_host;
            proxy_pass_header Authorization;
        }
    }

    server {
        listen 80;
        server_name notify.bjjl.dev;

        return 301 https://$server_name$request_uri;
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name notify.bjjl.dev;

        ssl_certificate      /usr/local/etc/letsencrypt/certs/bjjl.dev/fullchain.pem;
        ssl_certificate_key  /usr/local/etc/letsencrypt/certs/bjjl.dev/privkey.pem;

        location /.well-known/acme-challenge {
            alias /var/www/dehydrated;
        }

        location /send {
            proxy_pass http://unix:/tmp/notify.sock:/send;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
        }

        location /receive {
            proxy_pass http://unix:/tmp/notify.sock:/receive;

            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_buffering off;
            proxy_cache off;
            proxy_request_buffering off;

            proxy_read_timeout  86400s;
            proxy_send_timeout  86400s;

            chunked_transfer_encoding on;
        }
    }

    # ── Agentic AI demo (agentic.bjjl.dev) ────────────────────────────────
    # One host fronts three uvicorn apps (see bin/start.sh): the web shell
    # at /, the IBN dashboard at /ibn/, the DTW dashboard at /dtw/. The
    # trailing slash on the dashboard proxy_pass strips the /ibn|/dtw mount
    # prefix, so each app still sees its own /ws and /snapshot routes; the
    # dashboard HTML derives the prefix from location.pathname when building
    # those URLs. WebSocket upgrade headers are set on every location, and
    # read/send timeouts are long so idle live-feed sockets aren't dropped.
    # Basic Auth is enforced by the apps themselves (web/auth.py), with one
    # shared realm so the single agentic.bjjl.dev origin prompts only once.
    # NOTE: the bjjl.dev cert is NOT a wildcard (covers bjjl.dev +
    # notify.bjjl.dev only) — it must be reissued to add agentic.bjjl.dev
    # as a SAN before the 443 block validates. See the ssl_certificate note.
    server {
        listen 80;
        server_name agentic.bjjl.dev;

        return 301 https://$server_name$request_uri;
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name agentic.bjjl.dev;

        access_log /var/log/nginx/agentic.bjjl.dev/access.log;
        error_log  /var/log/nginx/agentic.bjjl.dev/error.log;

        # PREREQUISITE: this reuses the bjjl.dev certificate, which is NOT a
        # wildcard — as issued it covers only bjjl.dev + notify.bjjl.dev, so
        # it will NOT validate for agentic.bjjl.dev until reissued. Add
        # agentic.bjjl.dev to that cert (e.g. dehydrated domains.txt:
        # `bjjl.dev notify.bjjl.dev agentic.bjjl.dev`, then re-run dehydrated;
        # the renewed cert stays in this same bjjl.dev/ dir). Point DNS for
        # agentic.bjjl.dev at this host first so the HTTP-01 challenge below
        # can be served.
        ssl_certificate      /usr/local/etc/letsencrypt/certs/bjjl.dev/fullchain.pem;
        ssl_certificate_key  /usr/local/etc/letsencrypt/certs/bjjl.dev/privkey.pem;

        client_max_body_size 10m;

        location /.well-known/acme-challenge {
            alias /var/www/dehydrated;
        }

        # IBN dashboard (uvicorn :8060) — mounted at /ibn/
        location = /ibn { return 301 /ibn/; }
        location /ibn/ {
            proxy_pass http://127.0.0.1:8060/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # DTW dashboard (uvicorn :8080) — mounted at /dtw/
        location = /dtw { return 301 /dtw/; }
        location /dtw/ {
            proxy_pass http://127.0.0.1:8080/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # Web shell (uvicorn :8070) — at the root
        location / {
            proxy_pass http://127.0.0.1:8070;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }
    }

    server {
        listen 80;
        server_name qwabbl.com;

        location /.well-known/acme-challenge {
            alias /var/www/dehydrated;
        }

        location / {
            return 301 https://qwabbl.com$request_uri;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name qwabbl.com;

        charset utf-8;
        client_max_body_size 50m;

        access_log /var/log/nginx/qwabbl.com/access.log;
        error_log  /var/log/nginx/qwabbl.com/error.log;

        ssl_certificate      /usr/local/etc/letsencrypt/certs/qwabbl.com/fullchain.pem;
        ssl_certificate_key  /usr/local/etc/letsencrypt/certs/qwabbl.com/privkey.pem;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # Content-Security-Policy is owned by the app (Phase 3): Quart emits a
        # strict, nonce-based policy from after_request (app/__init__.py
        # _CSP_TEMPLATE).  Do NOT add a CSP here as well, or browsers receive
        # two policies (AND-combined).  See docs/security-csp-hardening.md.

        location /.well-known/acme-challenge {
            alias /var/www/dehydrated;
        }

        # Static files — served directly by nginx
        location /static/ {
            alias /usr/local/share/qwabbl/app/static/;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        location = /favicon.ico {
            alias /usr/local/share/qwabbl/app/static/icons/favicon.ico;
        }

        # SSE endpoints — must disable buffering for streaming
        location /stream/ {
            proxy_pass http://unix:/tmp/qwabbl.sock:/stream/;
            proxy_http_version 1.1;
            proxy_set_header Connection '';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 86400s;
            chunked_transfer_encoding on;
        }

        # GridFS media — edge-cached (see proxy_cache_path above).  nginx
        # stores only responses the app marks Cache-Control: public
        # (world-readable channels); private/gated media passes through
        # uncached.  Errors carry no cache headers and are not stored.
        location ~ ^/(image|attachment)/ {
            proxy_pass http://unix:/tmp/qwabbl.sock;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;
            proxy_cache qwabbl_media;
            proxy_cache_key $request_uri;
            # Media is byte-identical for every authorised viewer: a stray
            # session Set-Cookie must never make it uncacheable, never be
            # stored/replayed to other clients, and Vary must not fragment
            # the cache (no content negotiation on media).  Cache-Control
            # is still honoured, so `private` (gated) media is never stored.
            proxy_ignore_headers Set-Cookie Vary;
            proxy_hide_header Set-Cookie;
            add_header X-Media-Cache $upstream_cache_status;
            # add_header in a location discards the server-level set — the
            # security headers must be re-declared here.  CSP is omitted: the
            # app sets it on the proxied response (cached with the media), and
            # nginx no longer defines $csp (Phase 3).
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        }

        # Application — proxy to uvicorn via unix socket
        location / {
            proxy_pass http://unix:/tmp/qwabbl.sock;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;
        }
    }

    server {

        listen       80;
        listen       443 default_server ssl;
        http2 on;

        server_name  mx.plus lion.mx.plus;

        charset utf-8;

        ssl_certificate      /usr/local/etc/letsencrypt/certs/mx.plus/fullchain.pem;
        ssl_certificate_key  /usr/local/etc/letsencrypt/certs/mx.plus/privkey.pem;

        #ssl_session_cache    shared:SSL:1m;
        #ssl_session_timeout  5m;

        #ssl_ciphers  HIGH:!aNULL:!MD5;
        #ssl_prefer_server_ciphers  on;

        location /content {
            alias /var/www/content;
        }

        location /.well-known/acme-challenge {
            alias /var/www/dehydrated;
        }

        location / {

            include uwsgi_params;
            uwsgi_pass unix:/tmp/uwsgi.sock;

            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        }

        error_page 404 @error404;
        location @error404 {
            types {}
            default_type application/json;
            return 404 '{"error": {"status_code": 404, "status": "Not Found"}}';
        }

        error_page   500 502 503 504 @error500;
        location @error500 {
            types {}
            default_type application/json;
            return 500 '{"error": {"status_code": 500, "status": "General Error"}}';
        }

    }

    server {
        listen 80;
        server_name git.mx.plus;

        location /.well-known/acme-challenge {
            alias /var/www/dehydrated;
        }

        location / {
            return 301 https://git.mx.plus$request_uri;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name git.mx.plus;

        access_log /var/log/nginx/git.mx.plus.access.log;
        error_log /var/log/nginx/git.mx.plus.error.log;

        ssl_certificate      /usr/local/etc/letsencrypt/certs/mx.plus/fullchain.pem;
        ssl_certificate_key  /usr/local/etc/letsencrypt/certs/mx.plus/privkey.pem;

        client_max_body_size 512M;

        location /.well-known/acme-challenge {
            alias /var/www/dehydrated;
        }

        location / {
            proxy_pass http://127.0.0.1:3000;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
            proxy_connect_timeout 600s;
        }
    }
}
